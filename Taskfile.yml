# https://taskfile.dev
version: "3"

dotenv: [".env"]

vars:
  IMAGE: almena-landing:dev
  PORT: '{{.LANDING_PORT | default "4321"}}'

env:
  ASTRO_TELEMETRY_DISABLED: "1"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  init:
    desc: Create .env from .env.example (an existing .env is left untouched)
    cmds:
      - cp .env.example .env
    status:
      - test -f .env

  install:
    desc: Install the dependencies from package-lock.json
    cmds:
      - npm ci
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules/.package-lock.json

  dev:
    desc: Run the landing page locally with hot reload
    deps: [install]
    cmds:
      - npx astro dev --port {{.PORT}}

  build:
    desc: Build the static site (dist/)
    deps: [install]
    cmds:
      - npm run build

  preview:
    desc: Serve the production build locally (after task build)
    cmds:
      - npx astro preview --port {{.PORT}}

  lint:
    desc: Type-check the site
    deps: [install]
    cmds:
      - npx astro check

  check:
    desc: Everything that must pass before finishing a change (type-check + build)
    cmds:
      - task: lint
      - task: build

  docker:build:
    desc: Build the Docker image
    cmds:
      - docker compose build

  up:
    desc: Start the landing page in Docker (detached) and wait until it is healthy
    cmds:
      - docker compose up --build --detach --wait

  down:
    desc: Stop and remove the Docker containers
    cmds:
      - docker compose down

  logs:
    desc: Follow the landing page's container logs
    cmds:
      - docker compose logs --follow web

  health:
    desc: Query the running container's health endpoint
    cmds:
      - curl --fail --silent --show-error http://localhost:{{.PORT}}/health
    silent: true

  clean:
    desc: Remove node_modules, the build output and the local Docker image
    cmds:
      - rm -rf node_modules dist .astro
      - docker image rm -f {{.IMAGE}}

  clean:all:
    desc: Leave the repository as cloned — clean, plus the containers and their volumes, .env and the Task checksums
    prompt: Remove the containers and volumes and .env? They are recreated by `task init` and `task up`.
    cmds:
      # By the project's name, away from compose.yml: it needs no .env, so a
      # second run, or one after .env is gone, still works.
      - cd / && docker compose --project-name almena-landing down --volumes --remove-orphans
      - task: clean
      - rm -rf .task
      - find . -maxdepth 1 -name '.env*' ! -name '.env.example' -exec rm -f {} +
